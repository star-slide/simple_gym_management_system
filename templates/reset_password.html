<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 健身中心</title>
    <style>
        /* 继承login.html的主要风格 */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        /* 全屏背景图 */
        body {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            position: relative;
        }

        /* 表单容器 */
        .form-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* Internet Explorer and Edge */
            scrollbar-gutter: stable; /* Modern browsers */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.18);
        }

        /* 标题样式 */
        h2 {
            color: white;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }

        /* 表单字段统一样式 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: white;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #00a8ff;
            background: rgba(255,255,255,0.2);
        }

        /* 按钮样式 */
        button {
            width: 100%;
            padding: 14px;
            background: #00a8ff;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #0097e6;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,168,255,0.4);
        }

        /* 消息提示样式 */
        .alert {
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid;
        }

        .success {
            background: rgba(135, 218, 135, 0.9);
            border-color: #79c079;
        }

        .danger {
            background: rgba(255, 175, 175, 0.9);
            border-color: #ff7979;
        }

        /* 底部链接 */
        .links {
            text-align: center;
            margin-top: 25px;
            color: rgba(255,255,255,0.8);
        }

        .links a {
            color: #00a8ff;
            text-decoration: none;
            margin: 0 10px;
            transition: all 0.3s;
        }

        .links a:hover {
            color: #00c3ff;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>重置密码</h2>
        
        <!-- 消息提示 -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- 密码重置表单 -->
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required>
            </div>
            
            <div class="form-group">
                <label>新密码</label>
                <input type="password" name="new_password" required>
            </div>

            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" name="confirm_password" required>
            </div>

            <button type="submit">重置密码</button>
        </form>

        <!-- 底部链接 -->
        <div class="links">
            <p>
                <a href="{{ url_for('userpage') }}" ;">返回</a>
            </p>
        </div>
    </div>
    
    <!-- 自动跳转逻辑 -->
    {% if get_flashed_messages() %}
    <script>
        // 确保DOM完全加载且flash消息显示后再跳转
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                window.location.href = "{{ url_for('login') }}";
            }, 1500); // 延长到1.5秒确保flash显示
        });
    </script>
    {% endif %}
</body>
</html>
