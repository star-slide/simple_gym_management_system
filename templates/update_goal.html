<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新目标数据 - 健身中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            padding: 30px;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 12px;
            background: #00a8ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background: #0097e6;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>更新健身目标</h1>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="min_height">最小目标身高 (cm)</label>
                <input type="number" step="0.1" id="min_height" name="min_height" 
                       value="{{ goal_data.min_height if goal_data else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="max_height">最大目标身高 (cm)</label>
                <input type="number" step="0.1" id="max_height" name="max_height" 
                       value="{{ goal_data.max_height if goal_data else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="min_weight">最小目标体重 (kg)</label>
                <input type="number" step="0.1" id="min_weight" name="min_weight" 
                       value="{{ goal_data.min_weight if goal_data else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="max_weight">最大目标体重 (kg)</label>
                <input type="number" step="0.1" id="max_weight" name="max_weight" 
                       value="{{ goal_data.max_weight if goal_data else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="min_body_fat">最小目标体脂率 (%)</label>
                <input type="number" step="0.1" id="min_body_fat" name="min_body_fat" 
                       value="{{ goal_data.min_body_fat if goal_data else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="max_body_fat">最大目标体脂率 (%)</label>
                <input type="number" step="0.1" id="max_body_fat" name="max_body_fat" 
                       value="{{ goal_data.max_body_fat if goal_data else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="min_muscle_mass">最小目标肌肉量 (kg)</label>
                <input type="number" step="0.1" id="min_muscle_mass" name="min_muscle_mass" 
                       value="{{ goal_data.min_muscle_mass if goal_data else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="max_muscle_mass">最大目标肌肉量 (kg)</label>
                <input type="number" step="0.1" id="max_muscle_mass" name="max_muscle_mass" 
                       value="{{ goal_data.max_muscle_mass if goal_data else '' }}" required>
            </div>
            
            <button type="submit" class="btn-submit">保存目标</button>
        </form>
        
        <a href="{{ url_for('home') }}" class="back-link">← 返回首页</a>
    </div>
</body>
</html>
